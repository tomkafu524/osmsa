<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 高价值系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-lg">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">登录系统</h1>
            <p class="text-gray-600 mt-2">高价值安全认证中心</p>
        </div>
        
        <!-- 错误提示 -->
        <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            <strong class="font-bold">错误!</strong>
            <span class="block sm:inline"> 用户名或密码不正确</span>
        </div>
        
        <!-- 注册成功提示 -->
        <div id="register-success" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
            <strong class="font-bold">成功!</strong>
            <span class="block sm:inline"> 注册成功，请登录</span>
        </div>
        
        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-gray-700 mb-1">用户名</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                        <i class="fa fa-user text-gray-400"></i>
                    </span>
                    <input type="text" id="username" name="username" required
                        class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            
            <div>
                <label for="password" class="block text-gray-700 mb-1">密码</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                        <i class="fa fa-lock text-gray-400"></i>
                    </span>
                    <input type="password" id="password" name="password" required
                        class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input type="checkbox" id="remember" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                    <label for="remember" class="ml-2 block text-sm text-gray-700">记住我</label>
                </div>
                <a href="#" class="text-sm text-blue-600 hover:text-blue-800">忘记密码?</a>
            </div>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition duration-300">
                登录
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-gray-600">
                还没有账号? <a href="/register.html" class="text-blue-600 hover:text-blue-800 font-medium">立即注册</a>
            </p>
        </div>
    </div>

    <script>
        // 检查URL参数显示相应提示
        const params = new URLSearchParams(window.location.search);
        if (params.has('error')) {
            document.getElementById('error-message').classList.remove('hidden');
        }
        if (params.has('registered')) {
            document.getElementById('register-success').classList.remove('hidden');
        }
    </script>
</body>
</html>
