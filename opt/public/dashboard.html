<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - 高价值系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-gray-800">高价值系统</h1>
                </div>
                <div class="flex items-center">
                    <span id="username-display" class="mr-4 text-gray-700"></span>
                    <a href="/logout" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">
                        <i class="fa fa-sign-out mr-1"></i> 退出登录
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">欢迎使用高价值系统</h2>
            <p class="text-gray-600 mb-6">这是一个安全、可靠的认证系统，保护您的重要信息。</p>
            
            <div class="bg-blue-50 border-l-4 border-blue-500 p-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <i class="fa fa-info-circle text-blue-500 text-xl"></i>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm text-blue-700">
                            系统状态：正常运行中<br>
                            上次登录：刚刚
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 检查登录状态
        fetch('/check-login')
            .then(response => response.json())
            .then(data => {
                if (!data.loggedIn) {
                    // 如果未登录，重定向到登录页
                    window.location.href = '/login.html';
                } else {
                    // 显示用户名
                    document.getElementById('username-display').textContent = `欢迎，${data.username}`;
                }
            })
            .catch(err => {
                console.error('检查登录状态失败:', err);
                window.location.href = '/login.html';
            });
    </script>
</body>
</html>
