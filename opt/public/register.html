<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 高价值系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-lg">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">创建账号</h1>
            <p class="text-gray-600 mt-2">加入高价值安全系统</p>
        </div>
        
        <!-- 错误提示 -->
        <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            <strong class="font-bold">错误!</strong>
            <span class="block sm:inline"> 注册失败，请重试</span>
        </div>
        
        <form action="/register" method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-gray-700 mb-1">用户名</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                        <i class="fa fa-user text-gray-400"></i>
                    </span>
                    <input type="text" id="username" name="username" required
                        class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            
            <div>
                <label for="email" class="block text-gray-700 mb-1">电子邮箱</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                        <i class="fa fa-envelope text-gray-400"></i>
                    </span>
                    <input type="email" id="email" name="email" required
                        class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            
            <div>
                <label for="password" class="block text-gray-700 mb-1">密码</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                        <i class="fa fa-lock text-gray-400"></i>
                    </span>
                    <input type="password" id="password" name="password" required minlength="6"
                        class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md transition duration-300">
                注册
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-gray-600">
                已有账号? <a href="/login.html" class="text-blue-600 hover:text-blue-800 font-medium">立即登录</a>
            </p>
        </div>
    </div>

    <script>
        // 检查URL参数显示错误提示
        const params = new URLSearchParams(window.location.search);
        if (params.has('error')) {
            document.getElementById('error-message').classList.remove('hidden');
        }
    </script>
</body>
</html>
